<title>مساعد الكاهن الذكي</title>
<style>
:root{--brand:#c8ff2e;--brand-ink:#0a0f0b;--font:"Segoe UI",Tahoma,"Noto Kufi Arabic","Geeza Pro",system-ui,sans-serif;--radius:14px;
--urgent:#ff4d5e;--important:#f5a524;--normal:#7c8a84;--done:#2ecc71}
[data-theme="dark"]{--bg:#060a07;--surface:#0d130f;--surface-2:#131b15;--border:#1e2a21;--text:#e8efe9;--muted:#8a978e;--accent-text:var(--brand)}
[data-theme="light"]{--bg:#f3f5f2;--surface:#fff;--surface-2:#f2f5f1;--border:#e0e6de;--text:#0d130f;--muted:#5f6b65;--accent-text:#4f7000}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}.muted{color:var(--muted)}.sm{font-size:12px}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-inline-end:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.logo{width:46px;height:46px;border-radius:50%;background:var(--surface-2);color:var(--accent-text);display:grid;place-items:center;font-size:24px;flex:none;box-shadow:0 0 0 2px var(--brand)}
.logo img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}.brand .logo{cursor:pointer;overflow:hidden}.hero .hi{display:flex;align-items:center;gap:8px}.pf-ph{width:96px;height:96px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:var(--surface-2);box-shadow:0 0 0 2px var(--brand);overflow:hidden;font-size:40px;color:var(--accent-text)}.pf-ph img{width:100%;height:100%;object-fit:cover}.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}.cal-h .ttl{flex:1;text-align:center;font-weight:700;font-size:17px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal-w{text-align:center;color:var(--muted);font-size:11px;padding:2px 0}
.cal-d{min-height:58px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px 3px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text);font:inherit}
.cal-d.out{opacity:.35}.cal-d.today{box-shadow:0 0 0 2px var(--brand)}.cal-d.fast{background:var(--surface-2)}.cal-d .n{font-size:13px;font-weight:700}
.cal-dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}.cal-dots i{width:7px;height:7px;border-radius:50%;display:block}
.cal-leg{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;font-size:12px;color:var(--muted)}.cal-leg i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-inline-end:4px}
.vis-al{margin-top:10px;border-top:1px dashed var(--border);padding-top:8px}.vis-al h4{margin:0 0 6px;font-size:13px;color:var(--urgent)}.vis-al .trow{margin-bottom:4px}
.pick{max-height:46vh;overflow:auto;margin:8px 0}.pick label{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--border)}.pick input{width:auto}
.wz-step{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:8px 0}.wz-step b{color:var(--accent-text)}.wz-dots{display:flex;gap:5px;justify-content:center;margin-bottom:8px}.wz-dots i{width:22px;height:5px;border-radius:3px;background:var(--border)}.wz-dots i.on{background:var(--brand)}.wz ol{margin:6px 0;padding-inline-start:20px;line-height:1.9}.brand h1{font-size:17px;margin:0;line-height:1.25}.brand p{margin:0;color:var(--muted);font-size:12px}
.tabs{display:flex;flex-direction:column;gap:4px}
.tab{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;background:none;border:none;border-inline-start:3px solid transparent;border-radius:10px;color:var(--muted);cursor:pointer;font-weight:600;text-align:right}
.tab .ic{font-size:18px;width:22px;text-align:center}.tab .n{margin-inline-start:auto;font-size:12px;background:var(--surface-2);border-radius:99px;padding:0 8px}
.tab:hover{color:var(--text);background:var(--surface-2)}
.tab.on{color:var(--accent-text);background:var(--surface-2);border-inline-start-color:var(--brand)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
main{padding:22px;max-width:1100px;width:100%;margin:0 auto}
.btn{background:var(--surface-2);border:1px solid var(--border);padding:9px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent;font-weight:700}
.btn.danger{color:var(--urgent)}.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h2{margin:0;font-size:22px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:13px;color:var(--muted)}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:transparent;font-weight:700}
.hero{padding:22px 24px;border-radius:20px;margin-bottom:16px;border:1px solid var(--border);background:radial-gradient(120% 160% at 100% 0%,color-mix(in srgb,var(--brand) 14%,transparent),transparent 55%),var(--surface)}
.hero .hi{font-size:13px;color:var(--accent-text);font-weight:700}.hero h2{font-size:24px;margin:4px 0 4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:right}
.stat:hover{border-color:var(--brand)}.stat .v{font-size:24px;font-weight:800;line-height:1.2}.stat .l{font-size:12px;color:var(--muted)}
h3.sec{font-size:15px;margin:18px 0 8px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.card{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;border-inline-start:4px solid var(--border)}
.card:hover{border-color:var(--muted)}
.card.p-urgent{border-inline-start-color:var(--urgent)}.card.p-important{border-inline-start-color:var(--important)}
.card.done .t{text-decoration:line-through;color:var(--muted)}
.card .body{flex:1;min-width:0}.card .t{font-weight:700;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:3px}
.badge{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border)}
.badge.visit{color:var(--accent-text);border-color:var(--brand)}
.date-box{flex:none;width:52px;text-align:center;background:var(--surface-2);border-radius:10px;padding:4px 0}
.date-box b{display:block;font-size:20px;line-height:1.1}.date-box span{font-size:11px;color:var(--muted)}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);background:none;cursor:pointer;display:grid;place-items:center;color:var(--brand-ink);margin-top:2px}
.card.done .check{background:var(--done);border-color:var(--done)}
.empty{text-align:center;color:var(--muted);padding:36px 10px;border:1px dashed var(--border);border-radius:var(--radius)}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:14px;z-index:50}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;width:min(520px,100%);max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 12px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 11px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-start;flex-wrap:wrap}
.toast{position:fixed;bottom:150px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--brand);color:var(--brand-ink);padding:8px 16px;border-radius:99px;font-weight:700;z-index:60}
.syncdot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}.syncdot.ok{background:var(--done)}.syncdot.err{background:var(--urgent)}
.bottom{display:none}
@media(max-width:820px){
 .layout{grid-template-columns:1fr}.side{display:none}
 main{padding:14px 12px 150px}
 .bottom{display:flex;position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--border);z-index:40;padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
 .bottom{display:grid;grid-template-columns:repeat(7,1fr);gap:0;padding:2px 2px calc(2px + env(safe-area-inset-bottom))}.bottom button{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:3px 0;font-size:10px;line-height:1.15;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:inherit}
 .bottom button .ic{font-size:30px;line-height:1.1}.bottom button{font-size:10px;padding:2px 0 1px}.mtop{gap:4px}.mtop .btn{font-size:18px;padding:4px 8px;min-height:38px}.mtop .brand h1{font-size:14px}.mtop .logo{width:42px;height:42px;font-size:24px}.mtop #srchBtn2,.mtop #moreBtn2{font-size:22px;min-width:40px}.bottom button.on{color:var(--accent-text);font-weight:700}
 .mtop{display:flex!important}
}
.mtop{display:none;align-items:center;justify-content:space-between;margin-bottom:12px}
.mtop .brand h1{font-size:16px}.mtop .logo{width:38px;height:38px;font-size:20px}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px}
.pcard.overdue{border-color:var(--urgent)}
.pcard .p-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pcard .p-name{font-size:16px;font-weight:700;cursor:pointer;overflow-wrap:anywhere}
.pcard .meta{margin-top:4px}
.pbar{flex:1;height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--brand)}
.p-prog{display:flex;align-items:center;gap:10px}.p-prog b{min-width:44px}
.p-next{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:13px}.p-next span{color:var(--muted);font-size:11px;display:block}
.ms{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0}.ms .check{width:18px;height:18px;margin:0;border-width:2px}
.ms.done span{text-decoration:line-through;color:var(--muted)}.ms.done .check,.ms .check.on{background:var(--done);border-color:var(--done)}
.wk{border-top:1px solid var(--border);padding-top:8px}.wk h4{margin:0 0 6px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.wrow{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:4px 0;cursor:pointer}
.wrow .w-d{flex:none;min-width:84px;color:var(--muted)}.wrow .w-n{flex:1;overflow-wrap:anywhere}
.stars{color:var(--important);letter-spacing:1px;white-space:nowrap}
.ms-edit,.wk-edit{display:flex;gap:6px;align-items:center;margin-bottom:6px}.ms-edit input[type=text],.ms-edit .inp{flex:1}
.wk-edit{flex-wrap:wrap;background:var(--surface-2);border-radius:10px;padding:8px}
.wk-edit .inp{flex:1;min-width:110px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg label{margin:0;cursor:pointer}.seg input{display:none}.seg span{display:block;padding:6px 12px;border-radius:99px;border:1px solid var(--border);font-size:13px}.seg input:checked+span{background:var(--brand);color:var(--brand-ink);font-weight:700;border-color:transparent}
.chip2{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--border);background:var(--surface-2)}
.chip2.red{color:var(--urgent);border-color:var(--urgent)}

.rp-nav{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.rp-nav .ttl{flex:1;text-align:center;font-weight:700;min-width:140px}
.rp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.rp-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}.rp-box .v{font-size:26px;font-weight:800;line-height:1.2}.rp-box .l{font-size:12px;color:var(--muted)}
.rp-sec{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}.rp-sec h4{margin:0 0 6px;font-size:14px}
.rp-li{font-size:13px;padding:3px 0;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:space-between}.rp-li:first-of-type{border-top:0}
@media print{.side,.bottom,.head .btn,.rp-nav,.chips,.actions,.toast{display:none!important}.layout{display:block}body{background:#fff;color:#000}.rp-box,.rp-sec{border-color:#999;background:#fff;color:#000;break-inside:avoid}.muted,.rp-box .l{color:#333}}

.lock{position:fixed;inset:0;background:var(--bg);z-index:200;display:grid;place-items:center;padding:20px}
.lock .box{width:min(320px,100%);text-align:center}.lock .logo{margin:0 auto 12px}
.lock input{text-align:center;font-size:22px;letter-spacing:8px}
.trow{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--border);font-size:14px}.trow:first-of-type{border-top:0}.trow .tt{flex:1;min-width:0;overflow-wrap:anywhere}
.trow .btn{padding:4px 10px;font-size:12px}
.today{background:var(--surface);border:1px solid var(--brand);border-radius:16px;padding:12px 14px;margin-bottom:14px}.today h3{margin:0 0 6px;font-size:15px;color:var(--accent-text)}
.srch-r{padding:8px 0;border-top:1px solid var(--border);cursor:pointer}.srch-r small{color:var(--muted);display:block}
.foot{margin:28px 0 8px;text-align:center;color:var(--muted);font-size:12px;padding-bottom:130px}
@media(min-width:821px){.foot{padding-bottom:0}}
</style></head><body>
<div class="layout">
 <aside class="side">
  <div class="brand"><div class="logo">✝</div><div><h1>مساعد الكاهن الذكي</h1><p id="brandSub"></p></div></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="side-foot">
   <button class="btn primary hidden" id="installBtn">تثبيت التطبيق</button>

   <button class="btn" id="moreBtn">المزيد (قفل، تقويم، تصدير)</button>
   <button class="btn" id="themeBtn">الوضع الفاتح / الداكن</button>
  </div>
 </aside>
 <main>

   <div style="display:flex;gap:6px"><button class="btn sm hidden" id="installBtn2">تثبيت</button><button class="btn sm" id="syncBtn2"><span class="syncdot" id="syncDot2"></span> مزامنة</button><button class="btn sm" id="srchBtn2">🔍</button><button class="btn sm" id="moreBtn2">⋯</button></div></div>
  <div id="view"></div>
 <footer class="foot">Powered by: الأب شربل سمير <span dir="ltr" style="opacity:.6">· v9.0 (2026-11-24)</span></footer>
 </main>
</div>

<script>
"use strict";
const SECTIONS=[
 {id:"home",label:"الرئيسية",ic:"⌂"},
 {id:"calendar",label:"التقويم",ic:"📅"},
 {id:"visits",label:"تخطيط افتقاد",ic:"🚶"},
 {id:"services",label:"الخدمات",ic:"✚",list:"services",single:"خدمة",people:"المسؤول / الخادم",dated:false},
 {id:"meetings",label:"الاجتماعات",ic:"☰",list:"meetings",single:"اجتماع",people:"الحضور",dated:true},
 {id:"retreats",label:"النهضات",ic:"✦",list:"retreats",single:"نهضة",people:"المتكلم / الضيف",dated:true,end:true},
 {id:"liturgies",label:"القداسات",ic:"♱",list:"liturgies",single:"قداس",people:"الكاهن / الخادم",dated:true},
 {id:"tasks",label:"المهام اليومية",ic:"✔",list:"tasks",single:"مهمة",people:"الشخص / الأسرة",dated:true,task:true},
 {id:"prayers",label:"طلبات الصلاة",ic:"🙏",list:"prayers",single:"طلب صلاة",dated:false},
 {id:"needs",label:"احتياجات الأسر",ic:"🤝",list:"needs",single:"احتياج",dated:false},
 {id:"people",label:"المخدومين",ic:"👥",list:"people",single:"شخص",dated:false},
 {id:"counsel",label:"الاعتراف والإرشاد",ic:"🔒"},
 {id:"reports",label:"تقارير",ic:"▤"}
];
const LISTS=["services","meetings","retreats","liturgies","tasks","people","prayers","needs"];
const STORE="priest-assistant-v1",CFG="priest-sync-config",META="priest-sync-meta";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayISO=()=>iso(new Date());
function load(){try{const s=JSON.parse(localStorage.getItem(STORE)||"null");if(s)return norm(s)}catch(e){}return norm({})}
function norm(s){s=s||{};const o={version:1,settings:s.settings||{theme:"dark"}};LISTS.forEach(k=>o[k]=Array.isArray(s[k])?s[k].filter(x=>x&&x.id):[]);return o}
let state=load();
let ui={tab:"home",filter:"upcoming",taskCat:"all"};
function save(touch){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}try{logDiff()}catch(e){}if(touch!==false)markDirty()}
function live(k){return state[k].filter(x=>!x.deleted)}
function fmtDate(d,opt){if(!d)return"";try{return (d instanceof Date?d:new Date(d+"T12:00:00")).toLocaleDateString("ar-EG",opt||{weekday:"long",day:"numeric",month:"long",year:"numeric"})}catch(e){return d}}
function fmtTime(t){if(!t)return"";const[h,m]=t.split(":").map(Number);const ap=h>=12?"م":"ص";return new Date(2000,0,1,h,m).toLocaleTimeString("ar-EG",{hour:"numeric",minute:"2-digit",hour12:true})}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* ---------- render ---------- */
function counts(){const t=todayISO();return{
 services:live("services").length,
 meetings:live("meetings").filter(x=>(x.date||"9")>=t).length,
 retreats:live("retreats").filter(x=>(x.endDate||x.date||"9")>=t).length,
 liturgies:live("liturgies").filter(x=>(x.date||"9")>=t).length,
 tasks:live("tasks").filter(x=>x.status!=="done").length,
 people:live("people").length,prayers:live("prayers").filter(x=>x.status!=="answered").length,needs:live("needs").filter(x=>x.status!=="covered").length}}
function renderNav(){
 const c=counts();
 $("#tabs").innerHTML=SECTIONS.map(s=>`<button class="tab ${ui.tab===s.id?"on":""}" data-tab="${s.id}"><span class="ic">${s.ic}</span>${s.label}${s.list?`<span class="n">${c[s.list]}</span>`:""}</button>`).join("");
 $("#bottom").innerHTML=SECTIONS.map(s=>`<button class="${ui.tab===s.id?"on":""}" data-tab="${s.id}"><span class="ic">${s.ic}</span>${s.label.replace("المهام اليومية","المهام").replace("طلبات الصلاة","الصلاة").replace("احتياجات الأسر","الأسر").replace("الاعتراف والإرشاد","الإرشاد").replace("تخطيط افتقاد","افتقاد").replace("المخدومين","المخدومون")}</button>`).join("");
 document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab;ui.filter=ui.tab==="tasks"?"open":"upcoming";render();scrollTo(0,0)});
}
function render(){document.documentElement.dataset.theme=state.settings.theme||"dark";applyProfile();renderNav();ui.tab==="home"?renderHome():renderSection(SECTIONS.find(s=>s.id===ui.tab))}

/* ---------- reports ---------- */
let rp={mode:"day",date:todayISO()};
function addDays(d,n){const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return iso(x)}
function rpRange(){const d=rp.date;
 if(rp.mode==="day")return[d,d,fmtDate(d,{weekday:"long",day:"numeric",month:"long",year:"numeric"})];
 if(rp.mode==="week"){const s=weekStart(d),e=addDays(s,6);return[s,e,"أسبوع "+fmtDate(s,{day:"numeric",month:"long"})+" - "+fmtDate(e,{day:"numeric",month:"long",year:"numeric"})]}
 const x=new Date(d+"T12:00:00");
 if(rp.mode==="quarter"){const q=Math.floor(x.getMonth()/3),s=iso(new Date(x.getFullYear(),q*3,1)),e=iso(new Date(x.getFullYear(),q*3+3,0));return[s,e,"الربع "+["الأول","الثاني","الثالث","الرابع"][q]+" "+x.getFullYear()+" ("+fmtDate(s,{month:"long"})+" - "+fmtDate(e,{month:"long"})+")"]}
 if(rp.mode==="year"){const y=x.getFullYear();return[y+"-01-01",y+"-12-31","سنة "+y]}
 const s=iso(new Date(x.getFullYear(),x.getMonth(),1)),e=iso(new Date(x.getFullYear(),x.getMonth()+1,0));
 return[s,e,fmtDate(s,{month:"long",year:"numeric"})]}
function rpStep(n){const d=new Date(rp.date+"T12:00:00");if(rp.mode==="day")d.setDate(d.getDate()+n);else if(rp.mode==="week")d.setDate(d.getDate()+7*n);else if(rp.mode==="quarter")d.setMonth(d.getMonth()+3*n,1);else if(rp.mode==="year")d.setFullYear(d.getFullYear()+n,0,1);else d.setMonth(d.getMonth()+n,1);rp.date=iso(d)}
const inR=(d,s,e)=>d&&d>=s&&d<=e;
function rpCompute(){
 const[s,e,title]=rpRange(),today=todayISO();
 const doneDay=x=>x.doneAt||x.date||"";
 const tasks=live("tasks"),visitsAll=tasks.filter(x=>x.category==="visit");
 const visits=visitsAll.filter(x=>inR(x.lastContacted,s,e)||(x.status==="done"&&inR(doneDay(x),s,e)));
 const pv=live("people").filter(p=>inR(p.lastVisit,s,e));
 const people=[...new Set(visits.map(x=>(x.people||x.title||"").trim()).concat(pv.map(p=>p.title)).filter(Boolean))];
 const gen=tasks.filter(x=>x.category!=="visit");
 const tDone=gen.filter(x=>x.status==="done"&&inR(doneDay(x),s,e)),tPend=gen.filter(x=>x.status!=="done"&&x.date&&x.date<=e&&(x.date>=s||x.date<today));
 const vPend=visitsAll.filter(x=>x.status!=="done"&&inR(x.date,s,e));
 const meet=live("meetings").filter(x=>inR(x.date,s,e)&&x.date<=today);
 const meetNext=live("meetings").filter(x=>inR(x.date,s,e)&&x.date>today);
 const ret=live("retreats").filter(x=>x.date&&x.date<=e&&(x.endDate||x.date)>=s&&x.date<=today);
 const lit=live("liturgies").filter(x=>inR(x.date,s,e)&&x.date<=today);
 const svc=live("services").map(sv=>{const w=(sv.weeks||[]).filter(w=>w.week&&w.week<=e&&addDays(w.week,6)>=s);const r=w.filter(x=>x.rating);return{sv,w,n:w.length,done:w.filter(x=>x.done).length,avg:r.length?(r.reduce((a,x)=>a+Number(x.rating),0)/r.length):0,notes:w.map(x=>x.notes).filter(Boolean)}}).filter(x=>x.n);
 return{s,e,title,visits,pv,people,tDone,tPend,vPend,meet,meetNext,ret,lit,svc}}
function rpText(r){const L=[`تقرير ${({day:"يومي",week:"أسبوعي",month:"شهري",quarter:"ربع سنوي",year:"سنوي"})[rp.mode]} - ${r.title}`,"مساعد الكاهن الذكي",""];
 L.push(`الافتقادات: ${r.visits.length+r.pv.length} (عدد الأشخاص: ${r.people.length})`);if(r.people.length)L.push("  "+r.people.join("، "));
 L.push(`الاجتماعات: ${r.meet.length}`);r.meet.forEach(x=>L.push("  - "+x.title));
 L.push(`النهضات: ${r.ret.length}`);r.ret.forEach(x=>L.push("  - "+x.title));
 L.push(`القداسات: ${r.lit.length}`);r.lit.forEach(x=>L.push("  - "+x.title));
 L.push(`المهام: منجزة ${r.tDone.length} / معلّقة ${r.tPend.length}`);r.tDone.forEach(x=>L.push("  ✓ "+x.title));r.tPend.forEach(x=>L.push("  ○ "+x.title));
 if(r.vPend.length)L.push(`افتقادات معلّقة: ${r.vPend.length}`);
 L.push(`الخدمات (الأداء الأسبوعي): ${r.svc.length}`);r.svc.forEach(x=>L.push(`  - ${x.sv.title}: ${x.n} أسبوع، تمت ${x.done}${x.avg?"، التقييم "+x.avg.toFixed(1)+"/5":""}${x.notes.length?" ("+x.notes.join("؛ ")+")":""}`));
 if(rp.mode==="quarter"||rp.mode==="year"){const R=rpMonthly();L.push("","حسب الشهر (افتقادات / اجتماعات / نهضات / قداسات / مهام):");R.forEach(x=>L.push(`  ${x.m}: ${x.v} / ${x.mt} / ${x.rt} / ${x.l} / ${x.t}`));L.push("  المجموع: "+["v","mt","rt","l","t"].map(k=>R.reduce((a,x)=>a+x[k],0)).join(" / "))}
 return L.join("\n")}
function rpMonthly(){
 const[s,e]=rpRange(),keep={mode:rp.mode,date:rp.date},rows=[];
 let d=new Date(s+"T12:00:00");const end=new Date(e+"T12:00:00");
 d=new Date(d.getFullYear(),d.getMonth(),1,12);
 while(d<=end){rp.mode="month";rp.date=iso(d);try{const r=rpCompute();rows.push({m:fmtDate(rp.date,{month:"long"}),v:r.visits.length+r.pv.length,p:r.people.length,mt:r.meet.length,rt:r.ret.length,l:r.lit.length,t:r.tDone.length})}catch(x){}d=new Date(d.getFullYear(),d.getMonth()+1,1,12)}
 rp.mode=keep.mode;rp.date=keep.date;return rows}
function rpChart(rows){
 const mx=Math.max(1,...rows.map(r=>Math.max(r.v,r.l,r.mt)));
 const bar=(v,c)=>`<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:90px"><span style="font-size:10px">${v||""}</span><div style="width:80%;background:${c};border-radius:4px 4px 0 0;height:${Math.round(v/mx*70)}px;min-height:${v?2:0}px"></div></div>`;
 return `<div style="display:flex;gap:2px;align-items:flex-end;direction:rtl">${rows.map(r=>`<div style="flex:1;min-width:0"><div style="display:flex;align-items:flex-end;gap:1px">${bar(r.v,"#ff7aa2")}${bar(r.l,"#f5a524")}${bar(r.mt,"#4da3ff")}</div><div class="muted" style="font-size:10px;text-align:center;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(r.m)}</div></div>`).join("")}</div>
 <div class="muted sm" style="margin-top:6px"><span style="color:#ff7aa2">■</span> افتقادات &nbsp;<span style="color:#f5a524">■</span> قداسات &nbsp;<span style="color:#4da3ff">■</span> اجتماعات</div>`}
function rpStatsHtml(){
 if(rp.mode!=="quarter"&&rp.mode!=="year")return"";
 const R=rpMonthly(),T=k=>R.reduce((a,r)=>a+r[k],0);
 return `<div class="rp-sec"><h4>📊 الإحصائيات حسب الشهر</h4>${rpChart(R)}
 <table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;text-align:center"><tr class="muted"><th style="text-align:right">الشهر</th><th>افتقاد</th><th>اجتماع</th><th>نهضة</th><th>قداس</th><th>مهام</th></tr>
 ${R.map(r=>`<tr><td style="text-align:right">${esc(r.m)}</td><td>${r.v}</td><td>${r.mt}</td><td>${r.rt}</td><td>${r.l}</td><td>${r.t}</td></tr>`).join("")}
 <tr style="font-weight:700;border-top:1px solid var(--border)"><td style="text-align:right">المجموع</td><td>${T("v")}</td><td>${T("mt")}</td><td>${T("rt")}</td><td>${T("l")}</td><td>${T("t")}</td></tr></table></div>`}
function rpCsv(){
 const R=rpMonthly(),r=rpCompute(),q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const L=[["الفترة",r.title].map(q).join(","),["الشهر","افتقادات","أشخاص","اجتماعات","نهضات","قداسات","مهام منجزة"].map(q).join(",")];
 R.forEach(x=>L.push([x.m,x.v,x.p,x.mt,x.rt,x.l,x.t].map(q).join(",")));
 L.push(["المجموع",...["v","p","mt","rt","l","t"].map(k=>R.reduce((a,x)=>a+x[k],0))].map(q).join(","));
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+L.join("\n")],{type:"text/csv;charset=utf-8"}));a.download="stats-"+rp.mode+"-"+rp.date.slice(0,7)+".csv";a.click()}

/* ---------- sync (Google Sheet via Apps Script) ---------- */
const cfg=()=>{try{return JSON.parse(localStorage.getItem(CFG)||"null")}catch(e){return null}};
const meta=()=>{try{return JSON.parse(localStorage.getItem(META)||"{}")}catch(e){return{}}};
const setMeta=m=>localStorage.setItem(META,JSON.stringify(Object.assign(meta(),m)));
let timer=null,busy=false;
function dot(c){["#syncDot","#syncDot2"].forEach(s=>{const e=$(s);if(e)e.className="syncdot "+(c||"")})}
function markDirty(){if(!cfg())return;setMeta({dirty:1});clearTimeout(timer);timer=setTimeout(()=>sync(),1500)}
function mergeInto(a,b){ // per-item merge by id, newer updatedAt wins; nothing is dropped
 const sa=a.settings||{},sb=(b&&b.settings)||{};
 const out={version:1,settings:Object.assign({},sb,sa)};
 if((sb.profileAt||0)>(sa.profileAt||0)){out.settings.profile=sb.profile;out.settings.profileAt=sb.profileAt}
 if((sb.templatesAt||0)>(sa.templatesAt||0)){out.settings.templates=sb.templates;out.settings.templatesAt=sb.templatesAt}
 LISTS.forEach(k=>{const m=new Map();((b&&b[k])||[]).forEach(x=>m.set(x.id,x));
  (a[k]||[]).forEach(x=>{const y=m.get(x.id);if(!y||(x.updatedAt||0)>=(y.updatedAt||0))m.set(x.id,x)});out[k]=[...m.values()]});
 return norm(out)}
async function req(method,payload){
 const c=cfg();
 if(method==="GET"){const r=await fetch(c.url+(c.url.includes("?")?"&":"?")+"token="+encodeURIComponent(c.token));return r.json()}
 const r=await fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({token:c.token},payload))});return r.json()}
async function sync(){
 if(!cfg()||busy)return;if(!navigator.onLine){dot("err");return}busy=true;
 try{
  const r=await req("GET");if(r.error)throw new Error(r.error);
  let before=JSON.stringify(state);
  if(r.data)state=mergeInto(state,norm(r.data));
  const changed=JSON.stringify(state)!==before;
  const remoteSame=r.data&&JSON.stringify(mergeInto(norm(r.data),norm({})))===JSON.stringify(state);
  if(changed){localStorage.setItem(STORE,JSON.stringify(state));render()}
  if(!r.data||!remoteSame||meta().dirty){
   const p=await req("POST",{updatedAt:Date.now(),data:state});if(p.error)throw new Error(p.error);
   if(p.data){const mg=mergeInto(state,norm(p.data));if(JSON.stringify(mg)!==JSON.stringify(state)){state=mg;localStorage.setItem(STORE,JSON.stringify(state));render()}}
  }
  setMeta({dirty:0,last:Date.now()});dot("ok");
 }catch(e){dot("err")}finally{busy=false}}
function syncDialog(){
 const c=cfg()||{};if(!c.url){syncWizard(0);return}
 const m=openModal(`<h3>المزامنة بين الأجهزة</h3><p class="muted sm">البيانات تُحفظ في Google Sheet خاص بك. الرمز يُحفظ على هذا الجهاز فقط.</p><label>رابط التطبيق (Apps Script)</label><input id="sUrl" value="${esc(c.url||"")}" dir="ltr"><label>الرمز السري</label><input id="sTok" type="password" value="${esc(c.token||"")}" dir="ltr"><div class="actions"><button class="btn primary" id="sGo">حفظ وتفعيل</button><button class="btn" id="sLink">رابط جهاز ثانٍ</button><button class="btn" id="sWz">معالج الإعداد</button><button class="btn" data-close>إغلاق</button>${c.url?`<button class="btn danger" id="sOff" style="margin-inline-start:auto">إيقاف</button>`:""}</div>`);
 $("#sGo",m).onclick=()=>{const u=$("#sUrl",m).value.trim(),t=$("#sTok",m).value.trim();if(!/^https:\/\/script\.google\.com\//.test(u)||!t){toast("تحقق من الرابط والرمز");return}localStorage.setItem(CFG,JSON.stringify({url:u,token:t}));setMeta({dirty:1});closeModal();sync().then(()=>toast("تم تفعيل المزامنة"))};
 $("#sLink",m).onclick=()=>secondDevice();$("#sWz",m).onclick=()=>syncWizard(0);
 const off=$("#sOff",m);if(off)off.onclick=()=>{localStorage.removeItem(CFG);dot("");closeModal();toast("تم إيقاف المزامنة")};
}
(function(){const m=location.hash.match(/^#sync=(.+)$/);if(!m)return;
 try{const c=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
  if(c&&/^https:\/\/script\.google\.com\//.test(c.url)&&c.token){localStorage.setItem(CFG,JSON.stringify({url:c.url,token:c.token}));setMeta({dirty:1})}}catch(e){}
 history.replaceState(null,"",location.pathname+location.search)})();

function resizePhoto(file){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const S=256,c=document.createElement("canvas");c.width=c.height=S;const x=c.getContext("2d");const m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2;x.drawImage(im,sx,sy,m,m,0,0,S,S);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",0.8))};im.onerror=()=>rej();im.src=u})}

/* ---------- self-service sync wizard ---------- */
const GS_TPL="const TOKEN = '__TOKEN__';\nconst CHUNK = 40000;\nconst KEEP_BACKUPS = 30;\nconst LISTS = ['services', 'meetings', 'retreats', 'liturgies', 'tasks', 'people', 'prayers', 'needs'];\n\nfunction ss_() {\n  const props = PropertiesService.getScriptProperties();\n  const id = props.getProperty('SSID');\n  if (id) return SpreadsheetApp.openById(id);\n  let ss = null;\n  try { ss = SpreadsheetApp.getActiveSpreadsheet(); } catch (e) {}\n  if (!ss) ss = SpreadsheetApp.create('مساعد الكاهن - بيانات');\n  props.setProperty('SSID', ss.getId());\n  return ss;\n}\nfunction sheet_() { const ss = ss_(); return ss.getSheetByName('data') || ss.insertSheet('data'); }\nfunction setup() { Logger.log(ss_().getUrl()); }\nfunction out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }\nfunction read_() {\n  const s = sheet_();\n  const n = s.getLastRow();\n  if (n < 2) return { updatedAt: 0, data: null };\n  const updatedAt = Number(s.getRange(1, 1).getValue()) || 0;\n  const parts = s.getRange(2, 1, n - 1, 1).getValues().map(r => r[0]).join('');\n  return { updatedAt: updatedAt, data: parts ? JSON.parse(parts) : null };\n}\nfunction backup_(cur, force) {\n  if (!cur || !cur.data) return;\n  const ss = ss_();\n  const b = ss.getSheetByName('backups') || ss.insertSheet('backups');\n  const last = b.getLastRow();\n  if (last > 0 && !force && Date.now() - Number(b.getRange(last, 1).getValue()) < 10 * 60 * 1000) return;\n  const text = JSON.stringify(cur.data);\n  const row = [Date.now()];\n  for (let i = 0; i < text.length; i += CHUNK) row.push(text.substring(i, i + CHUNK));\n  b.appendRow(row);\n  const n = b.getLastRow();\n  if (n > KEEP_BACKUPS) b.deleteRows(1, n - KEEP_BACKUPS);\n}\nfunction write_(updatedAt, data) {\n  const s = sheet_();\n  const text = JSON.stringify(data);\n  const rows = [];\n  for (let i = 0; i < text.length; i += CHUNK) rows.push([text.substring(i, i + CHUNK)]);\n  s.clear();\n  s.getRange(1, 1).setValue(updatedAt);\n  if (rows.length) s.getRange(2, 1, rows.length, 1).setValues(rows);\n}\nfunction rid_() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }\n// Merge by id. The newer updatedAt wins. Nothing is ever dropped.\nfunction merge_(a, b) {\n  const out = { version: 1, settings: Object.assign({}, (a && a.settings) || {}, (b && b.settings) || {}) };\n  const sa = (a && a.settings) || {}, sb = (b && b.settings) || {};\n  if ((sa.templatesAt || 0) > (sb.templatesAt || 0)) { out.settings.templates = sa.templates; out.settings.templatesAt = sa.templatesAt; }\n  LISTS.forEach(function (k) {\n    const m = {};\n    const order = [];\n    ((a && a[k]) || []).forEach(function (x) { if (x && x.id) { m[x.id] = x; order.push(x.id); } });\n    ((b && b[k]) || []).forEach(function (x) {\n      if (!x || !x.id) return;\n      const y = m[x.id];\n      if (!y) { m[x.id] = x; order.push(x.id); }\n      else if ((x.updatedAt || 0) >= (y.updatedAt || 0)) m[x.id] = x;\n    });\n    out[k] = order.map(function (id) { return m[id]; });\n  });\n  return out;\n}\nfunction doGet(e) {\n  const p = (e && e.parameter) || {};\n  if (p.token !== TOKEN) return out_({ error: 'unauthorized' });\n  if (p.action === 'upsert') return upsert_(p);\n  return out_(read_());\n}\n// Add or update ONE item by id. Never deletes, never replaces other items.\nfunction upsert_(p) {\n  const list = p.type;\n  if (LISTS.indexOf(list) < 0) return out_({ error: 'bad type' });\n  let item;\n  try { item = JSON.parse(p.item); } catch (err) { return out_({ error: 'bad item json' }); }\n  if (!item || typeof item !== 'object') return out_({ error: 'bad item' });\n  const lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    const cur = read_();\n    backup_(cur, true);\n    const data = cur.data || { version: 1, settings: {} };\n    LISTS.forEach(function (k) { if (!Array.isArray(data[k])) data[k] = []; });\n    if (!item.id) item.id = rid_();\n    if (!item.createdAt) item.createdAt = Date.now();\n    const now = Date.now();\n    item.updatedAt = now;\n    const i = data[list].findIndex(function (x) { return x && x.id === item.id; });\n    if (i >= 0) data[list][i] = Object.assign({}, data[list][i], item); else data[list].push(item);\n    write_(now, data);\n    return out_({ ok: true, id: item.id, updatedAt: now, count: data[list].length });\n  } finally { lock.releaseLock(); }\n}\nfunction doPost(e) {\n  let body;\n  try { body = JSON.parse(e.postData.contents); } catch (err) { return out_({ error: 'bad json' }); }\n  if (body.token !== TOKEN) return out_({ error: 'unauthorized' });\n  if (body.action === 'calsync') return calsync_(body.items || []);\n  const lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    const cur = read_();\n    backup_(cur);\n    const merged = merge_(cur.data, body.data);\n    const now = Date.now();\n    write_(now, merged);\n    return out_({ ok: true, updatedAt: now, data: merged });\n  } finally { lock.releaseLock(); }\n}\n\n// ---- Google Calendar sync (idempotent: one event id per item key) ----\nfunction parseD_(d, t) {\n  return Utilities.parseDate(d + ' ' + (t || '00:00'), 'Africa/Cairo', 'yyyy-MM-dd HH:mm');\n}\nfunction setRem_(ev, it) {\n  try {\n    ev.removeAllReminders();\n    if (it.time) {\n      ev.addPopupReminder(1440);\n      ev.addPopupReminder(0);\n      const mins = (parseInt(it.time.split(':')[0], 10) - 8) * 60 + parseInt(it.time.split(':')[1] || 0, 10);\n      if (mins > 30) ev.addPopupReminder(mins);\n    } else {\n      ev.addPopupReminder(900);\n      ev.addPopupReminder(0);\n    }\n  } catch (e) {}\n}\nfunction calsync_(items) {\n  const lock = LockService.getScriptLock();\n  lock.waitLock(30000);\n  try {\n    const ss = ss_();\n    const sh = ss.getSheetByName('calmap') || ss.insertSheet('calmap');\n    const vals = sh.getLastRow() ? sh.getRange(1, 1, sh.getLastRow(), 3).getValues() : [];\n    const map = {};\n    vals.forEach(function const DRAFT="priest-sync-draft";
const genTok=()=>{const a=new Uint8Array(24);crypto.getRandomValues(a);return [...a].map(x=>"abcdefghijkmnpqrstuvwxyz23456789ABCDEFGHJKLMNPQRSTUVWXYZ"[x%54]).join("")};

 `<h3>ربط المزامنة (خطوة 1 من 7)</h3><p>بعد الربط تعمل على الموبايل والكمبيوتر معًا، وبياناتك تُحفظ في Google Sheet خاص بك أنت فقط. يستغرق الإعداد نحو 5 دقائق، والأسهل أن تفعله مرة واحدة من الكمبيوتر.</p><div class="wz-step">لا تحتاج أي حساب جديد: يكفي حساب Google (Gmail) الخاص بك.</div>`,
 `<h3>خطوة 2: أنشئ Google Sheet جديدًا</h3><ol><li>اضغط الزر أدناه، سيفتح جدولًا فارغًا في حسابك.</li><li>اكتب له اسمًا، مثل: <b>مساعد الكاهن</b>.</li></ol><div class="actions"><a class="btn primary" href="https://sheets.new" target="_blank" rel="noopener">فتح جدول جديد</a></div>`,
 `<h3>خطوة 3: افتح محرر الأكواد</h3><ol><li>في الجدول اختر القائمة <b>الإضافات</b> (Extensions).</li><li>ثم <b>Apps Script</b>. تفتح صفحة جديدة. (لو لم يفتح، ادخل script.google.com وأنشئ مشروعًا جديدًا، وسينشئ الكود جدوله بنفسه.)</li><li>احذف كل ما فيها من كود (حدد الكل ثم احذف).</li></ol>`,
 `<h3>خطوة 4: الصق الكود</h3><ol><li>اضغط "نسخ الكود" أدناه.</li><li>الصقه في محرر Apps Script (مكان الكود المحذوف).</li><li>اضغط حفظ (أيقونة القرص أو Ctrl+S).</li></ol><p class="muted sm">الكود فيه رمزك السري الخاص الذي أنشأه التطبيق لك، ولا يعرفه أحد غيرك.</p><div class="actions"><button class="btn primary" id="wzCopy">نسخ الكود</button></div><textarea readonly dir="ltr" style="height:70px;margin-top:8px" id="wzCode"></textarea>`,
 `<h3>خطوة 5: فعّل الصلاحيات</h3><ol><li>في الشريط العلوي لمحرر Apps Script اختر من القائمة المنسدلة الدالة <b dir="ltr">installTrigger</b>.</li><li>اضغط <b>تشغيل</b> (Run).</li><li>ستظهر نافذة صلاحيات: اضغط <b>مراجعة الأذونات</b>، اختر حسابك. قد تطلب Google تأكيد هويتك على هاتفك.</li><li>اضغط <b>Advanced (خيارات متقدمة)</b>، ثم <b>Go to ... (unsafe)</b>.</li><li>اضغط <b>Continue</b>، ثم علّم <b>Select all (تحديد الكل)</b> واضغط <b>Continue</b> مرة أخرى.</li><li>تأكد أن سجل التنفيذ يظهر "Execution completed".</li></ol><p class="muted sm">التحذير طبيعي لأن الكود من إنشائك أنت. هذه الخطوة تسمح بحفظ البيانات في جدولك، ومزامنة التقويم، وإرسال ملخص يومي لبريدك الساعة 8 صباحًا بتوقيت القاهرة.</p>`,

 `<h3>خطوة 7: الصق الرابط هنا</h3><label>رابط تطبيق الويب</label><input id="wzUrl" dir="ltr" placeholder="https://script.google.com/macros/s/.../exec"><p id="wzMsg" class="sm" style="min-height:22px"></p><div class="actions"><button class="btn primary" id="wzGo">اختبار وتفعيل</button></div><p class="muted sm">بعد التفعيل: من "المزامنة" اضغط "رابط جهاز ثانٍ" لتربط جوالك أو كمبيوترك الآخر.</p>`];
 const m=openModal(`<div class="wz">${dots}${S[step]}<div class="actions" style="margin-top:12px">${step>0?`<button class="btn" id="wzB">السابق</button>`:""}${step<N-1?`<button class="btn primary" id="wzN" style="margin-inline-start:auto">التالي</button>`:""}<button class="btn" data-close>إغلاق</button></div></div>`);
 const b=$("#wzB",m),n=$("#wzN",m);if(b)b.onclick=()=>syncWizard(step-1);if(n)n.onclick=()=>syncWizard(step+1);
 if(step===3){const code=GS_TPL.replace("__TOKEN__",T);$("#wzCode",m).value=code;$("#wzCopy",m).onclick=async()=>{if(!await copyTxt(code)){$("#wzCode",m).select();$("#wzCode",m).style.height="160px";toast("حدد الكود وانسخه يدويًا")}}}
 if(step===6)$("#wzGo",m).onclick=async()=>{const u=$("#wzUrl",m).value.trim(),msg=$("#wzMsg",m);

   localStorage.setItem(CFG,JSON.stringify({url:u,token:T}));localStorage.removeItem(DRAFT);setMeta({dirty:1});closeModal();await sync();toast("تم تفعيل المزامنة");secondDevice()}
  catch(e){msg.style.color="var(--urgent)";msg.textContent="لم ينجح الاختبار. تأكد أن \"من لديه حق الوصول\" = أي شخص، وأنك لصقت الكود الجديد ثم نشرت نسخة جديدة."}}}

/* ---------- fasting (approximate Coptic calendar) ---------- */
function orthEaster(y){const a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7,mo=Math.floor((d+e+114)/31),da=(d+e+114)%31+1;const x=new Date(y,mo-1,da+13,12);return iso(x)}
function fastInfo(ds){
 const y=Number(ds.slice(0,4)),E=orthEaster(y),df=(a,b)=>Math.round((new Date(a+"T12:00:00")-new Date(b+"T12:00:00"))/864e5),k=df(ds,E),md=ds.slice(5),dow=new Date(ds+"T12:00:00").getDay();
 if(k>=-55&&k<=-1)return"الصوم الكبير"+(k>=-7?" (أسبوع الآلام)":"");
 if(k>=-69&&k<=-67)return"صوم يونان";
 if(k===0)return"";
 const pent=k+0, apEnd=md<="07-11";
 if(k>=51&&md<="07-11")return"صوم الرسل";
 if(md>="08-07"&&md<="08-21")return"صوم السيدة العذراء";
 if(md>="11-25"||md<="01-06")return"صوم الميلاد";
 if((dow===3||dow===5)&&!(k>=0&&k<=49))return dow===3?"صوم الأربعاء":"صوم الجمعة";
 return""}

/* ---------- today ---------- */
function daysTo(md,from){ // days until next occurrence of month-day
 if(!md)return null;const p=md.slice(-5).split("-");const f=new Date(from+"T12:00:00");let d=new Date(f.getFullYear(),Number(p[0])-1,Number(p[1]),12);if(d<f)d=new Date(f.getFullYear()+1,Number(p[0])-1,Number(p[1]),12);return Math.round((d-f)/864e5)}
function lastVisitOf(p){const nm=(p.title||"").trim();let best=p.lastVisit||"";
 live("tasks").forEach(x=>{if(x.category==="visit"&&x.lastContacted&&nm&&((x.people||"").includes(nm)||(x.title||"").includes(nm))&&x.lastContacted>best)best=x.lastContacted});return best}
function dueList(){const t=todayISO();return live("people").map(p=>{const lv=lastVisitOf(p);return{p,lv,days:lv?Math.round((new Date(t+"T12:00:00")-new Date(lv+"T12:00:00"))/864e5):99999}}).sort((a,b)=>b.days-a.days)}
function todayBlock(){
 const t=todayISO(),rows=[];
 live("tasks").filter(x=>x.status!=="done"&&x.date&&x.date<=t).sort(sortItems).forEach(x=>rows.push({l:"tasks",x,late:x.date<t}));
 ["meetings","retreats","liturgies"].forEach(l=>live(l).filter(x=>x.date&&x.date<=t&&(x.endDate||x.date)>=t).forEach(x=>rows.push({l,x})));
 const bd=live("people").map(p=>({p,b:daysTo(p.birthday,t),n:daysTo(p.nameDay,t)})).filter(o=>o.b!==null&&o.b<=7||o.n!==null&&o.n<=7);
 const due=dueList().slice(0,3);
 const fs=fastInfo(t);
 return `<div class="today"><h3>اليوم</h3>${fs?`<div class="muted sm" style="margin-bottom:6px">🕊 يوم صيام: ${fs} <span style="opacity:.7">(تقدير حسب التقويم القبطي، راجع تقويم الكنيسة)</span></div>`:""}${rows.map(({l,x,late})=>`<div class="trow"><div class="tt">${esc(x.title)}${x.time?" · "+esc(fmtTime(x.time)):""} ${late?`<span class="badge" style="color:var(--urgent)">متأخرة ${esc(fmtDate(x.date,{day:"numeric",month:"short"}))}</span>`:""}<small class="muted" style="display:block">${l==="tasks"?"مهمة":SECTIONS.find(s=>s.list===l).single}</small></div>${l==="tasks"?`<button class="btn" data-tdone="${x.id}">✓ تمت</button>`:""}<button class="btn" data-tmove="${l}:${x.id}">غدًا</button></div>`).join("")||`<div class="muted sm">لا شيء مجدول اليوم 🙏</div>`}
 ${bd.length?`<div class="muted sm" style="margin-top:8px">🎂 ${bd.map(o=>esc(o.p.title)+(o.b!==null&&o.b<=7?(o.b===0?" (عيد ميلاد اليوم)":" (ميلاد بعد "+o.b+" يوم)"):" (عيد الشفيع بعد "+o.n+" يوم)")).join("، ")}</div>`:""}
 ${due.length?`<div class="muted sm" style="margin-top:6px">يستحقون افتقادًا: ${due.map(o=>esc(o.p.title)+(o.lv?"":" (لم يُفتقد)")).join("، ")}</div>`:""}${visitAlerts()}</div>`}

/* ---------- recurring ---------- */
function ensureRecurring(){
 const t=todayISO(),horizon=addDays(t,35);let made=0;
 ["meetings","liturgies","tasks"].forEach(l=>{
  state[l].filter(x=>x.recur&&!x.parent&&(!x.deleted||x.seriesOn)&&x.date).forEach(b=>{
   let d=b.date,k=0;
   while(k++<400){const o=new Date(d+"T12:00:00");if(b.recur==="daily")o.setDate(o.getDate()+1);else if(b.recur==="weekly")o.setDate(o.getDate()+7);else{const day=new Date(b.date+"T12:00:00").getDate();o.setMonth(o.getMonth()+1,1);const last=new Date(o.getFullYear(),o.getMonth()+1,0).getDate();o.setDate(Math.min(day,last))}
    d=iso(o);if(d>horizon)break;if(b.until&&d>b.until)break;if(d<t)continue;
    const id=b.id+"@"+d;if(state[l].some(x=>x.id===id))continue;
    const c=Object.assign({},b,{id,parent:b.id,recur:"",date:d,createdAt:Date.now(),updatedAt:Date.now()});
    if(l==="tasks"){c.status="pending";c.doneAt="";}
    if(b.endDate){c.endDate=addDays(d,Math.round((new Date(b.endDate+"T12:00:00")-new Date(b.date+"T12:00:00"))/864e5))}
    state[l].push(c);made++}}) });
 if(made){save()}}

const visThr=()=>Math.max(1,Number(state.settings.visitDays)||90);
function visRow(p,extra){const lv=lastVisitOf(p);return `<div class="trow"><div class="tt">${esc(p.title)}<small class="muted" style="display:block">${extra||""}${lv?"آخر افتقاد: "+esc(fmtDate(lv,{day:"numeric",month:"short",year:"numeric"})):"لم يُسجَّل افتقاد"}</small></div><button class="btn" data-vdone="${p.id}">✓ تم</button><button class="btn" data-vmove="${p.id}">غدًا</button></div>`}
function visitAlerts(){
 const t=todayISO(),ppl=live("people"),thr=visThr();
 const pend=ppl.filter(p=>p.planDate&&p.planDate<t).sort((a,b)=>a.planDate.localeCompare(b.planDate));
 const tod=ppl.filter(p=>p.planDate===t);
 const stale=dueList().filter(o=>o.days>=thr&&!(o.p.planDate&&o.p.planDate<=t));
 let h="";

 if(c)$("#pOff",m).onclick=async()=>{if(!await chk())return;localStorage.removeItem(PINK);localStorage.removeItem(WAK);closeModal();toast("تم إيقاف القفل")}}
/* ---------- CSV export ---------- */
function csvExport(){
 const rows=[["القسم","العنوان","التاريخ","الوقت","المكان","الأشخاص","الحالة","ملاحظات"]];
 SECTIONS.filter(s=>s.list).forEach(s=>live(s.list).forEach(x=>rows.push([s.label,x.title,x.date||"",x.time||"",x.place||"",x.people||"",x.status||"",x.notes||""])));
 const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv"}));a.download="priest-assistant-"+todayISO()+".csv";a.click()}
/* ---------- Google Calendar sync (via Apps Script) ---------- */
async function calSync(btn){
 if(!cfg()){toast("اربط المزامنة أولًا");return}
 const items=[];
 [["meetings","اجتماع"],["retreats","نهضة"],["liturgies","قداس"],["services","خدمة"],["tasks","مهمة"]].forEach(([l,lab])=>state[l].forEach(x=>{
  if(!x.date&&!x.deleted)return;
  items.push({key:l+":"+x.id,kind:lab,title:x.title,date:x.date||"",time:x.time||"",endDate:x.endDate||"",place:x.place||"",notes:[x.people?("الأشخاص: "+x.people):"",x.notes||""].filter(Boolean).join("\n"),done:x.status==="done",deleted:!!x.deleted})}));
 btn.disabled=true;const old=btn.textContent;btn.textContent="جارٍ المزامنة...";
 try{await sync();const r=await req("POST",{action:"calsync",items});
  if(r.error)throw new Error(r.error);
  toast(`التقويم: ${r.created} جديد، ${r.updated} محدّث، ${r.removed} محذوف`+(r.failed?`، ${r.failed} تعذّر`:""));
  setMeta({calLast:Date.now()})}
 catch(e){toast("تعذّرت مزامنة التقويم: "+e.message)}finally{btn.disabled=false;btn.textContent=old}}

}

/* ---------- in-app alerts + chime ---------- */
let _ac=null;
function chime(){if(state.settings.sound===false)return;try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();if(_ac.state==="suspended")_ac.resume();const n=_ac.currentTime;[[660,0],[880,.18]].forEach(([f,d])=>{const o=_ac.createOscillator(),g=_ac.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0,n+d);g.gain.linearRampToValueAtTime(.12,n+d+.03);g.gain.exponentialRampToValueAtTime(.001,n+d+.5);o.connect(g);g.connect(_ac.destination);o.start(n+d);o.stop(n+d+.55)})}catch(e){}}
addEventListener("pointerdown",()=>{try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();if(_ac.state==="suspended")_ac.resume()}catch(e){}},{once:true});
function alertItems(){
 const t=todayISO(),o=[];
 const due=[];["meetings","liturgies","retreats"].forEach(l=>live(l).forEach(x=>{if(x.date&&x.date<=t&&(x.endDate||x.date)>=t)due.push(x.title+(x.time?" ("+x.time+")":""))}));
 live("tasks").forEach(x=>{if(x.status!=="done"&&x.date===t)due.push(x.title+(x.time?" ("+x.time+")":""))});
 if(due.length)o.push({k:"due",t:"اليوم: "+due.slice(0,3).join("، ")+(due.length>3?" +"+(due.length-3):"")});
 const od=live("tasks").filter(x=>x.status!=="done"&&x.date&&x.date<t);
 if(od.length)o.push({k:"over",t:"⚠ مهام متأخرة ("+od.length+"): "+od.slice(0,2).map(x=>x.title).join("، ")});
 const ppl=live("people"),pl=ppl.filter(p=>p.planDate&&p.planDate<=t);
 if(pl.length)o.push({k:"plan",t:"افتقادات مخططة/مؤجلة ("+pl.length+"): "+pl.slice(0,3).map(p=>p.title).join("، ")});
 const thr=visThr(),st=dueList().filter(x=>x.days>=thr&&!(x.p.planDate&&x.p.planDate<=t));
 if(st.length)o.push({k:"stale",t:"لم يتم افتقاد "+st.length+" منذ "+thr+" يومًا أو أكثر"});
 return o}
function showAlerts(force){
 let it;try{it=alertItems()}catch(e){return}
 if(!it.length)return;
 const key="priest_alert_seen",today=todayISO(),sig=today+"|"+it.map(x=>x.k+x.t).join("|");
 let last="";try{last=localStorage.getItem(key)||""}catch(e){}
 if(!force&&last===sig)return;
 try{localStorage.setItem(key,sig)}catch(e){}
 chime();
 const b=document.createElement("div");b.className="toast";b.style.cssText+=";white-space:normal;text-align:right;max-width:92%;line-height:1.6;cursor:pointer;font-weight:500;font-size:13px;border-radius:16px;padding:10px 14px";b.innerHTML="🔔 "+it.map(x=>esc(x.t)).join("<br>")+'<div style="font-size:11px;opacity:.8;margin-top:4px">اضغط للإغلاق</div>';
 b.onclick=()=>b.remove();document.body.appendChild(b);setTimeout(()=>b.remove(),12000);
 if(state.settings.notif&&"Notification" in window&&Notification.permission==="granted"){try{navigator.serviceWorker.ready.then(r=>r.showNotification("مساعد الكاهن",{body:it.map(x=>x.t).join("\n"),icon:"icon-192.png",tag:"priest-today"}))}catch(e){}}
}
function alertDialog(){
 const snd=state.settings.sound!==false,nt=!!state.settings.notif,np="Notification" in window?Notification.permission:"unsupported";
 const m=openModal(`<h3>🔔 التنبيهات والصوت</h3>
 <label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input type="checkbox" id="alS" ${snd?"checked":""}> نغمة خفيفة مع التنبيه</label>
 <label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input type="checkbox" id="alN" ${nt?"checked":""} ${np==="unsupported"||np==="denied"?"disabled":""}> إشعارات المتصفح (عند فتح التطبيق/تثبيته) ${np==="denied"?"· محظورة من إعدادات المتصفح":np==="unsupported"?"· غير مدعومة هنا":""}</label>
 <p class="muted sm">التطبيق ينبّهك بمهام اليوم والمتأخرة والافتقادات <b>أثناء فتحه</b> فقط (مرة عند الفتح وكل 10 دقائق عند وجود جديد).<br>عندما يكون التطبيق مغلقًا، التنبيهات تأتي من <b>تقويم Google</b> (التذكيرات) و<b>إيميل الصباح</b> الساعة 8:00 — وليس من التطبيق نفسه.</p>
 <div class="actions"><button class="btn" id="alT">جرّب التنبيه الآن</button><button class="btn primary" id="alOk">حفظ</button></div>`);
 $("#alT",m).onclick=()=>{const was=state.settings.sound;state.settings.sound=$("#alS",m).checked;chime();state.settings.sound=was;toast("🔔 هكذا يبدو التنبيه")};
 $("#alOk",m).onclick=async()=>{state.settings.sound=$("#alS",m).checked;let n=$("#alN",m).checked;if(n&&"Notification" in window&&Notification.permission==="default"){try{n=(await Notification.requestPermission())==="granted"}catch(e){n=false}}state.settings.notif=n;state.settings.soundAt=Date.now();save();closeModal();toast("تم الحفظ")};
}
setTimeout(()=>showAlerts(false),2500);setInterval(()=>showAlerts(false),600000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)setTimeout(()=>showAlerts(false),800)});
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}));let hadCtl=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(hadCtl)location.reload();hadCtl=true});}
showLock();ensureRecurring();render();if(cfg())sync();
</script></body></html>
